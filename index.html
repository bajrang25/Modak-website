<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7B1B1B" />

    <title>मोदक भवन | Modak Bhavan</title>
    <meta
      name="description"
      content="पारंपरिक विधि से बने ताज़ा मोदक — चॉकलेट, पान और क्लासिक स्टीम मोदक। प्री ऑर्डर शुरू है। Fresh homemade modaks, pre-order on WhatsApp."
    />

    <!-- Link preview when the site is shared on WhatsApp / Instagram -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="मोदक भवन — प्री ऑर्डर शुरू है!" />
    <meta
      property="og:description"
      content="ताज़ा, शुद्ध और घरेलू स्वाद वाले मोदक। चॉकलेट · पान · क्लासिक स्टीम। अभी ऑर्डर करें।"
    />
    <!-- These MUST be absolute URLs — WhatsApp and Instagram will not resolve
         a relative one, and the shared link would show no picture.
         If the site ever moves to another address, change it in all three. -->
    <meta property="og:site_name" content="मोदक भवन · Modak Bhavan" />
    <meta property="og:url" content="https://modakbhavan.netlify.app/" />
    <meta property="og:image" content="https://modakbhavan.netlify.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="चॉकलेट, पान और क्लासिक स्टीम मोदक" />
    <meta property="og:locale" content="hi_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://modakbhavan.netlify.app/" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mukta:wght@300;400;500;600;700;800&family=Yatra+One&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
</html>
